name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-docker:
    name: Build Docker Image and Push to Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./web-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:buildcache,mode=max

  deploy-to-kubernetes:
    name: Deploy to K8s
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3

      - name: Set K8s Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply K8s Configurations
        run: |
          # Applying the backend deployment manifest
          kubectl apply -f web-backend/k8s/deployment.yaml
          
          # Force a rollout restart to pull the 'latest' image
          kubectl rollout restart deployment/easygo-backend -n production

      - name: Deployment Verification
        run: kubectl rollout status deployment/easygo-backend -n production