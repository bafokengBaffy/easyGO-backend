name: Nightly Backend Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  nightly-test:
    name: Run backend test suite nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SKIP_DB_CHECK: true
          JWT_SECRET: testsecret_testsecret_testsecret_testse
