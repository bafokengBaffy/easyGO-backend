name: Full CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Install, Lint, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    defaults:
      run:
        working-directory: web-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Lint source files
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          SKIP_DB_CHECK: true
          JWT_SECRET: testsecret_testsecret_testsecret_testse

      - name: Upload JUnit test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: web-backend/test-results/junit.xml

      - name: Upload coverage (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: web-backend/coverage

  frontend:
    name: Frontend — Build (optional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    if: ${{ exists('web-frontend') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

