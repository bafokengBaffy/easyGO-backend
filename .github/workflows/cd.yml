name: Continuous Delivery

on:
	push:
		branches: [ main ]

permissions:
	contents: read
	id-token: write

jobs:
	validate-secrets:
		name: Validate required secrets
		runs-on: ubuntu-latest
		outputs:
			docker: ${{ steps.check.outputs.docker }}
			kube: ${{ steps.check.outputs.kube }}
			render: ${{ steps.check.outputs.render }}
		steps:
			- name: Check secrets presence
				id: check
				run: |
					docker_ok=true
					kube_ok=true
					render_ok=false

					if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
						docker_ok=false
					fi

					if [ -z "${{ secrets.KUBECONFIG }}" ]; then
						kube_ok=false
					fi

					if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.RENDER_SERVICE_ID }}" ]; then
						render_ok=true
					fi

					echo "::set-output name=docker::$docker_ok"
					echo "::set-output name=kube::$kube_ok"
					echo "::set-output name=render::$render_ok"

			- name: Fail when critical secrets missing
				if: steps.check.outputs.docker == 'false' || steps.check.outputs.kube == 'false'
				run: |
					echo "Required secrets are missing. Ensure DOCKERHUB_USERNAME, DOCKERHUB_TOKEN and KUBECONFIG are set in repository secrets."
					exit 1

	build-and-push-docker:
		name: Build and Push Docker Image
		needs: validate-secrets
		runs-on: ubuntu-latest
		if: needs.validate-secrets.outputs.docker == 'true'
		steps:
			- name: Checkout repository
				uses: actions/checkout@v4

			- name: Set up Docker Buildx
				uses: docker/setup-buildx-action@v3

			- name: Login to Docker Hub
				uses: docker/login-action@v3
				with:
					username: ${{ secrets.DOCKERHUB_USERNAME }}
					password: ${{ secrets.DOCKERHUB_TOKEN }}

			- name: Build and push backend image
				uses: docker/build-push-action@v5
				with:
					context: ./web-backend
					push: true
					tags: |
						${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:latest
						${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:${{ github.sha }}
					cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:buildcache
					cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/easygo-backend:buildcache,mode=max

	deploy-to-k8s:
		name: Deploy to Kubernetes
		needs: build-and-push-docker
		runs-on: ubuntu-latest
		if: needs.validate-secrets.outputs.kube == 'true'
		steps:
			- name: Checkout repository
				uses: actions/checkout@v4

			- name: Setup kubectl
				uses: azure/setup-kubectl@v3

			- name: Configure Kubeconfig
				env:
					KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
				run: |
					echo "$KUBECONFIG_DATA" | base64 --decode > kubeconfig
					export KUBECONFIG=$(pwd)/kubeconfig
					kubectl version --client

			- name: Apply K8s manifests
				run: |
					kubectl apply -f web-backend/k8s/deployment.yaml || true
					kubectl apply -f web-backend/k8s/service.yaml || true
					kubectl rollout restart deployment/easygo-backend -n production || true

	deploy-to-render:
		name: Deploy to Render (optional)
		needs: build-and-push-docker
		runs-on: ubuntu-latest
		if: needs.validate-secrets.outputs.render == 'true'
		steps:
			- name: Checkout repository
				uses: actions/checkout@v4

			- name: Deploy using Render API
				env:
					RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
					SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
				run: |
					echo "Triggering Render deploy via API"
					curl -X POST \
						-H "Authorization: Bearer $RENDER_API_KEY" \
						-H "Content-Type: application/json" \
						-d '{"serviceId":"'$SERVICE_ID'"}' \
						https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }} || true
